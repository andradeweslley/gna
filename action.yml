name: "Gná - Notification Action for GitHub Actions Workflow"
description: "Send a notification to Hófvarpnir via POST /api/notify"
inputs:
  api_key:
    description: "Bearer token for /api/notify (use secrets.API_KEY or similar)"
    required: true
  title:
    description: "Notification title"
    required: true
  message:
    description: "Notification body (sent as body in JSON)"
    required: false
    default: ""
  status:
    description: "One of started, success, failed"
    required: false
    default: "started"
  warn_only:
    description: "When true, report a failed delivery as a warning instead of failing the step"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Notify
      shell: bash
      env:
        API_KEY: ${{ inputs.api_key }}
        TITLE: ${{ inputs.title }}
        MESSAGE: ${{ inputs.message }}
        STATUS: ${{ inputs.status }}
        WARN_ONLY: ${{ inputs.warn_only }}
        BASE_URL: "https://hofvarpnir.weslleyandrade.dev.br"
      run: |
        set -e
        # Build JSON body safely with jq (available on GitHub-hosted runners)
        BODY=$(jq -n \
          --arg title "$TITLE" \
          --arg body "$MESSAGE" \
          --arg status "$STATUS" \
          '{title: $title, body: $body, status: $status}')
        RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${BASE_URL}/api/notify" \
          -H "Authorization: Bearer ${API_KEY}" \
          -H "Content-Type: application/json" \
          -d "$BODY") || true
        HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
        PAYLOAD=$(echo "$RESPONSE" | sed '$d')
        if [[ "$HTTP_CODE" =~ ^2[0-9][0-9]$ ]]; then
          exit 0
        fi

        # A 2xx used to be returned even when nothing reached a device, so a broken
        # setup looked green. Name the reason so the failure is actionable.
        case "$HTTP_CODE" in
          409) REASON="no active push subscription — enable push in the dashboard" ;;
          502) REASON="push service rejected the notification" ;;
          401) REASON="invalid API key" ;;
          429) REASON="rate limited" ;;
          *)   REASON="HTTP ${HTTP_CODE:-no response}" ;;
        esac
        MSG="Gná: notification not delivered ($REASON)"

        if [[ "$WARN_ONLY" == "true" ]]; then
          echo "::warning::$MSG"
          echo "$PAYLOAD"
          exit 0
        fi
        echo "::error::$MSG"
        echo "$PAYLOAD"
        exit 1
